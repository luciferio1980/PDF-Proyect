name: ci

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            qt6-base-dev qt6-base-dev-tools \
            libgl1-mesa-dev libxkbcommon-dev \
            libqpdf-dev \
            libtesseract-dev tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa tesseract-ocr-fra \
            tesseract-ocr-deu tesseract-ocr-ita tesseract-ocr-por \
            libleptonica-dev python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -DPDFFORGE_WITH_QPDF=OFF -DPDFFORGE_WITH_TESSERACT=OFF
      - name: Build
        shell: cmd
        run: cmake --build build --config RelWithDebInfo
      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure -C RelWithDebInfo
      - name: Package portable zip
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 -BuildDir "$pwd/build" -OutDir "$pwd/dist/PDFForge" -Config RelWithDebInfo
          Get-ChildItem "$pwd/dist/PDFForge" -Recurse -File | Select-Object FullName, Length
          Compress-Archive -Path "$pwd/dist/PDFForge" -DestinationPath "$pwd/dist/PDFForge-windows-x64.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFForge-windows-x64
          path: dist/PDFForge-windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.11-alpha
          name: PDFForge Alpha 0.2.11
          body: |
            Portable Windows build of PDFForge Alpha 0.2.11.

            Selected text keeps its original size. The selection box
            grows to fit instead of shrinking the glyphs. Hover the
            border for the four-arrow move cursor.

            1. Download `PDFForge-windows-x64.zip`
            2. Unzip the whole archive (do not run the exe from inside the zip)
            3. Open the `PDFForge` folder
            4. Double-click `Abrir PDFForge.bat` or `PDFForge.exe`
            5. If SmartScreen appears: More info → Run anyway

            OCR is not in the Windows portable zip (Tesseract is Linux CI only).
            Native PDF text recognition still works without Tesseract.
          files: dist/PDFForge-windows-x64.zip
          fail_on_unmatched_files: true
